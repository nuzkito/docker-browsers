name: Publish

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  IMAGE: nuzkito/browsers

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Run the smoke test and save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm -i "$IMAGE@$DIGEST" node - < test/smoke.js
          mkdir digests && touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: highest
        run: |
          highest() { git tag --list "$1" --sort=v:refname | grep -xE '[0-9]+\.[0-9]+\.[0-9]+' | tail -n 1; }
          echo "minor=$(highest "${GITHUB_REF_NAME%.*}.*")" >> "$GITHUB_OUTPUT"
          echo "major=$(highest "${GITHUB_REF_NAME%%.*}.*")" >> "$GITHUB_OUTPUT"
          echo "latest=$(highest '*')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.highest.outputs.minor == github.ref_name }}
            type=semver,pattern={{major}},enable=${{ steps.highest.outputs.major == github.ref_name }}
            type=raw,value=latest,enable=${{ steps.highest.outputs.latest == github.ref_name }}

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the tested images
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -r '.tags[] | "--tag " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
